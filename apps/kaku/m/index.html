<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-itunes-app" content="app-id=6794861840">
<meta property="og:title" content="Kaku — この台を引く">
<meta property="og:description" content="誰かが置いた台から、絵を1枚だけ引けます。">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<title>Kaku — この台を引く</title>
<style>
  :root{color-scheme:light}
  body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#f4efe6;color:#2b2622;display:flex;min-height:100vh;align-items:center;justify-content:center}
  main{padding:32px;max-width:420px;text-align:center}
  h1{font-size:32px;margin:0 0 8px;letter-spacing:.02em}
  p{line-height:1.8;margin:0 0 24px}
  p.sub{color:#6b625a;font-size:14px;margin-top:-12px}
  .actions{display:flex;flex-direction:column;gap:12px;align-items:center}
  a.btn{display:inline-block;min-width:220px;padding:14px 28px;border-radius:999px;background:#2b2622;color:#f4efe6;text-decoration:none;font-weight:600}
  a.btn.secondary{background:transparent;color:#2b2622;box-shadow:inset 0 0 0 1.5px #2b2622}
  a.home{display:inline-block;margin-top:28px;color:#6b625a;font-size:14px}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <section id="kaku">
    <h1>Kaku</h1>
    <p>誰かが置いた台から、絵を1枚だけ引けます。</p>
    <p class="sub">Pull one drawing from a machine someone placed.</p>
    <div class="actions">
      <a class="btn hidden" id="open-app" href="#">アプリで開く</a>
      <a class="btn" id="store" href="https://apps.apple.com/app/id6794861840">App Storeで入手</a>
    </div>
  </section>
  <section id="notfound" class="hidden">
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。</p>
    <a class="btn" href="https://kazusa703.github.io/">imai apps トップへ</a>
  </section>
  <a class="home" href="https://kazusa703.github.io/support.html">サポート</a>
</main>
<script>
(function(){
  var path=location.pathname;
  var m=path.match(/^\/apps\/kaku\/m\/([A-Za-z0-9]{20,64})\/?$/);
  var isKaku=/^\/apps\/kaku\/m\/?/.test(path);
  if(m){
    var a=document.getElementById("open-app");
    a.href="kaku://machine/"+m[1];
    a.classList.remove("hidden");
    document.getElementById("store").classList.add("secondary");
  }else if(!isKaku){
    document.getElementById("kaku").classList.add("hidden");
    document.getElementById("notfound").classList.remove("hidden");
    document.title="ページが見つかりません — imai apps";
  }
})();
</script>
</body>
</html>
