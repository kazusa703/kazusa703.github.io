*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:780px;margin:0 auto;padding:24px;background:var(--bg);color:var(--ink);line-height:1.74}

.links{display:grid;gap:12px;margin-top:30px}.links a{display:block;color:var(--ink);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px 19px}
.links a span{display:block;color:var(--accent2);font-size:.9rem;margin-top:3px}ul{padding-left:22px}li{margin:.45rem 0}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
@media(prefers-color-scheme:dark){:root{--bg:#171a18;--surface:#242925;--ink:#f3efe6;--muted:#b7beb9;--accent:#d1ad79;--accent2:#87b7a9;--tint:#323027;--line:#41463f}}</style>
